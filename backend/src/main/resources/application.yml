server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ai-chat
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB

app:
  llm:
    base-url: ${LLM_BASE_URL:https://api.deepseek.com}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:deepseek-chat}
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:60}
    extract-temperature: ${LLM_EXTRACT_TEMPERATURE:0.0}
  dify:
    base-url: ${DIFY_BASE_URL:http://localhost/v1}
    api-key: ${DIFY_DATASET_API_KEY:}
    default-dataset-id: ${DIFY_DEFAULT_DATASET_ID:}
    dataset-a-id: ${DIFY_DATASET_A_ID:}
    dataset-b-id: ${DIFY_DATASET_B_ID:}
    poll-interval-ms: ${DIFY_POLL_INTERVAL_MS:2000}
    poll-timeout-ms: ${DIFY_POLL_TIMEOUT_MS:180000}
    connect-timeout-seconds: ${DIFY_CONNECT_TIMEOUT_SECONDS:10}
    request-timeout-seconds: ${DIFY_REQUEST_TIMEOUT_SECONDS:60}
    separator: "${DIFY_SEPARATOR:\n\n}"
    max-tokens: ${DIFY_MAX_TOKENS:800}
    chunk-overlap: ${DIFY_CHUNK_OVERLAP:100}
  dify-chat:
    base-url: ${DIFY_BASE_URL:http://localhost/v1}
    app-a-key: ${DIFY_APP_API_KEY_A:}
    app-b-key: ${DIFY_APP_API_KEY:}
    connect-timeout-seconds: ${DIFY_CONNECT_TIMEOUT_SECONDS:10}
    request-timeout-seconds: ${DIFY_CHAT_TIMEOUT_SECONDS:120}
  workflow:
    base-url: ${DIFY_BASE_URL:http://localhost/v1}
    api-key: ${DIFY_WORKFLOW_API_KEY:}
    connect-timeout-seconds: ${DIFY_CONNECT_TIMEOUT_SECONDS:10}
    request-timeout-seconds: ${DIFY_WORKFLOW_TIMEOUT_SECONDS:120}
  terms:
    overrides: {}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{traceId:--}] [%15.15t] %-40.40logger{39} : %m%n"
